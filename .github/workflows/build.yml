name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read  # the build only reads the repository; artifact upload does not use this token

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commits: a moved tag cannot change what builds the installers.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # nothing pushes; keep the token out of .git/config while pip runs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: packaging/macos/build.sh
      - name: Build Ubuntu package
        if: runner.os == 'Linux'
        run: packaging/linux/build-deb.sh
      # Only builds of main and v* tags publish installers: a pull request (from a fork, too) could change
      # the build scripts, and its artifacts would look just like the real ones.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: git-version-tagger-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.deb
