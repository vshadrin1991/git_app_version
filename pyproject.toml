[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "git-version-tagger"
dynamic = ["version"]
description = "Menu bar app that moves version tags (3.25-#<hash>) to the head of a branch"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "platformdirs>=4",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.6"]

[project.scripts]
git-version-tagger = "git_version_tagger.cli:main"

[tool.setuptools.dynamic]
version = { attr = "git_version_tagger.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_version_tagger = ["resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
